name: Format

on:
  push:
  pull_request:

jobs:
  format:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:format
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-format.yml@d903a20396dce0f98960a8c9ea96848349682540 # v4.2.0
