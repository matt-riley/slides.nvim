name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "lua/**"
      - "plugin/**"
      - "Makefile"
      - "VERSION"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  docs:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-docs.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      commit-message: "chore(docs): regenerate vim help"
      file-pattern: doc/*.txt

