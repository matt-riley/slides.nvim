name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:tests
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-tests.yml@d903a20396dce0f98960a8c9ea96848349682540 # v4.2.0
    with:
      neovim-version: nightly
