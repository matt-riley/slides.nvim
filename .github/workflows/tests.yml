name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:tests
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-tests.yml@c956b4c8237a0b1d733735d48a3724edde629717 # v4
    with:
      neovim-version: nightly
